version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: the-vault-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - ./backend/storage/app/public:/var/www/html/storage/app/public:ro
      - ./frontend/frontend/dist:/var/www/html/frontend:ro
    depends_on:
      - php
      - node
    networks:
      - the-vault-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: the-vault-php
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=the_vault
      - DB_USERNAME=the_vault
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=null
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - the-vault-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: the-vault-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    environment:
      - MYSQL_ROOT_PASSWORD=root_secret
      - MYSQL_DATABASE=the_vault
      - MYSQL_USER=the_vault
      - MYSQL_PASSWORD=secret
    networks:
      - the-vault-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: the-vault-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ""
    networks:
      - the-vault-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  node:
    image: node:20-alpine
    container_name: the-vault-node
    working_dir: /app/frontend/frontend
    volumes:
      - ./frontend/frontend:/app/frontend/frontend
      - /app/frontend/frontend/node_modules
    ports:
      - "5173:5173"
      - "5174:5174"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - the-vault-network
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: the-vault-queue
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=the_vault
      - DB_USERNAME=the_vault
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - the-vault-network
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: the-vault-scheduler
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=the_vault
      - DB_USERNAME=the_vault
      - DB_PASSWORD=secret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - the-vault-network
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    restart: unless-stopped

networks:
  the-vault-network:
    driver: bridge
    name: the-vault-network

volumes:
  mysql_data:
    driver: local
    name: the-vault-mysql-data
  redis_data:
    driver: local
    name: the-vault-redis-data