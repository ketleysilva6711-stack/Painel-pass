# prometheus.yml - Configuração do Prometheus
# Local: monitoring/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'the-vault-production'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'rules/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Laravel Application
  - job_name: 'laravel'
    metrics_path: /metrics
    static_configs:
      - targets: ['php:9000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'the-vault-api'

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'the-vault-nginx'

  # MySQL
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql:3306']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'the-vault-mysql'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'the-vault-redis'

  # Node Exporter (Host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'the-vault-host'

  # cAdvisor (Container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'the-vault-containers'

  # Uptime Kuma
  - job_name: 'uptime-kuma'
    static_configs:
      - targets: ['uptime-kuma:3001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'the-vault-uptime'

  # Blackbox Exporter (HTTP checks)
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://${DOMAIN:-localhost}/api/health
          - https://${DOMAIN:-localhost}/api/auth/me
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115