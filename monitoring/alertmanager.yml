# alertmanager.yml - Configuração do Alertmanager
# Local: monitoring/alertmanager.yml

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@seu-dominio.com'
  smtp_auth_username: 'alerts@seu-dominio.com'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/template/*.tmpl'

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: true
    - match:
        alertname: 'Watchdog'
      receiver: 'watchdog'

receivers:
  - name: 'default'
    email_configs:
      - to: 'admin@seu-dominio.com'
        send_resolved: true
        headers:
          subject: '[The Vault] {{ .GroupLabels.alertname }} - {{ .Status }}'
    telegram_configs:
      - api_url: 'https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage'
        chat_id: '${TELEGRAM_CHAT_ID}'
        message: |
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* - {{ .Status }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          *Job:* {{ .Labels.job }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@seu-dominio.com'
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }} - {{ .Status }}'
    telegram_configs:
      - api_url: 'https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage'
        chat_id: '${TELEGRAM_CHAT_ID}'
        message: |
          🚨 *CRITICAL ALERT* 🚨
          {{ range .Alerts }}
          *{{ .Labels.alertname }}*
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          *Job:* {{ .Labels.job }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: 'warning-alerts'
    email_configs:
      - to: 'admin@seu-dominio.com'
        send_resolved: true
        headers:
          subject: '[WARNING] {{ .GroupLabels.alertname }} - {{ .Status }}'
    telegram_configs:
      - api_url: 'https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage'
        chat_id: '${TELEGRAM_CHAT_ID}'
        message: |
          ⚠️ *WARNING*
          {{ range .Alerts }}
          *{{ .Labels.alertname }}*
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          *Job:* {{ .Labels.job }}
          *Summary:* {{ .Annotations.summary }}
          {{ end }}

  - name: 'watchdog'
    email_configs:
      - to: 'admin@seu-dominio.com'
        send_resolved: true
        headers:
          subject: '[WATCHDOG] Prometheus Watchdog - {{ .Status }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance', 'job']