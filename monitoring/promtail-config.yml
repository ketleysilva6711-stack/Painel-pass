# promtail-config.yml - Configuração do Promtail
# Local: monitoring/promtail-config.yml

server:
  http_listen_port: 9080
  grpc_listen_port: 9081

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Laravel Application Logs
  - job_name: laravel
    static_configs:
      - targets:
          - localhost
        labels:
          job: laravel
          app: the-vault
          environment: production
          __path__: /var/log/laravel/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            context: context
            datetime: datetime
      - labels:
          level:
      - timestamp:
          source: datetime
          format: RFC3339

  # Nginx Access Logs
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          app: the-vault
          environment: production
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)" "(?P<http_x_forwarded_for>[^"]*)"'
      - labels:
          status:
          method:
          path:
      - timestamp:
          source: time_local
          format: '02/Jan/2006:15:04:05 -0700'

  # Nginx Error Logs
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          app: the-vault
          environment: production
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<message>.*)'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: '2006/01/02 15:04:05'

  # Docker Container Logs (stdout/stderr)
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: container-logs
          app: the-vault
          environment: production
          __path__: /var/log/containers/*.log
    pipeline_stages:
      - docker: {}
      - labels:
          container_name:
          image_name: