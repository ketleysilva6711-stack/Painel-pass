# datasources.yaml - Configuração de DataSources do Grafana
# Local: monitoring/grafana/datasources/datasources.yaml

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: traceID
          matcherRegex: "trace[=:]([a-f0-9]+)"
          url: "http://localhost:16686/trace/${__value.raw}"
          datasourceUid: "tempo"

  - name: Cadvisor
    type: prometheus
    access: proxy
    url: http://cadvisor:8080
    editable: false
    jsonData:
      timeInterval: "15s"

  - name: Node Exporter
    type: prometheus
    access: proxy
    url: http://node-exporter:9100
    editable: false
    jsonData:
      timeInterval: "15s"