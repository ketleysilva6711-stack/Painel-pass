upstream vite_dev {
    server node:5173;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 55M;

    # DNS dinâmico do Docker: o IP do container php muda a cada recreate.
    # Com upstream estático o nginx guardava o IP antigo (502). Com variável
    # + resolver, a resolução respeita o TTL e acompanha o recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # QR PNG dinâmico (/api/q/{id}.png → Laravel). ^~ impede que o bloco
    # de assets estáticos (~* png) capture a rota e retorne 404.
    location ^~ /api/q/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location ~ /\.(?!well-known) {
        deny all;
    }
}